# This workflow will install Python dependencies and verify the project builds correctly

name: Build Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * FRI'

jobs:
  build-checks:

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    - name: Install library
      run: poetry install --no-interaction
    - name: Verify confederations crawler
      run: |
        poetry run python -m tfmkt confederations
    # Offline parser tests first: they need no network, run in under a second, and are
    # the ones that fail when a parser stops extracting a value. Running them ahead of
    # the live suite means a parser regression is reported as itself rather than as a
    # symptom of whichever Transfermarkt page happened to be flaky that morning.
    - name: Run parser tests (offline)
      run: |
        poetry run python -m pytest tests/test_parsers.py -v
    - name: Run crawler tests (live site)
      run: |
        poetry run python -m pytest tests/test_crawlers.py -v
